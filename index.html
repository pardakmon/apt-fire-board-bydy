<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공동주택 화재 현황판</title>
<!-- 화면 캡처를 위한 html2canvas 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#0f172a;
    --line:#cbd5e1;
    --line-soft:#94a3b8;
    --origin:#dc2626;      
    --spread:#ea580c;      
    --evac:#16a34a;        
    --rescue:#e11d48;      
    --locked:#64748b;      
    --clear-bg:#10b981;    
    --normal:#334155;
    --panel-bg:#ffffff;
    --panel-border:#e2e8f0;
    --accent:#ea580c;      
    --navy:#1e293b;        
    --gold:#f59e0b;
  }
  *{box-sizing:border-box;}
  
  body{
    font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    background:#f1f5f9;
    margin:0;
    padding:24px;
    color:var(--ink);
    position: relative;
    z-index: 0;
  }

  /* 로그인 화면 스타일 */
  #loginScreen {
    position: fixed; inset: 0; background: var(--navy); 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20000;
  }
  .login-box {
    background: #fff; padding: 30px; border-radius: 12px; width: 90vw; max-width: 340px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center;
  }
  .login-box h2 { margin: 0 0 20px; color: var(--navy); font-weight:800; font-size: 22px; }
  .login-box .field { margin-bottom: 15px; text-align: left;}
  .login-box .field label { font-size:12px; color:#64748b; font-weight:700; display:block; margin-bottom:6px; }
  .login-box .field input { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; outline:none; transition:border-color 0.2s; box-sizing:border-box; }
  .login-box .field input:focus { border-color:var(--accent); }
  .login-box button { width: 100%; padding: 12px; font-size: 14.5px; margin-top: 10px; }
  .login-error { color: var(--rescue); font-size: 12.5px; margin-top: 10px; display: none; font-weight: 700; background:#fff1f2; padding:8px; border-radius:6px;}

  /* 📷 캡처될 알맹이 구역 */
  #captureTarget {
    position: relative;
    background: #f1f5f9;
    padding: 10px; 
    border-radius: 12px;
    overflow: hidden; 
  }
  
  /* 🌟 확실하게 캡처되는 투명 도화지 (워터마크) 구역 */
  .watermark-bg {
    position: absolute !important;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.15;
    z-index: 0 !important;
    pointer-events: none;
  }
  
  /* 로고 통 (모바일에서도 충분히 크도록 min-width 450px 설정) */
  .watermark-content {
    width: 70%; 
    min-width: 450px; 
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  #captureTarget > * { position: relative; z-index: 1; }
  .wrap{max-width:1100px;margin:0 auto; position: relative; z-index: 1;}
  h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; margin:0 0 24px; color:#1d1d1f; }
  
  /* 부드러운 그림자와 넓은 여백의 패널 */
  .panel { background:#ffffff; border:none; border-radius:20px; padding:32px 36px; margin-bottom:24px; box-shadow:0 4px 24px rgba(0,0,0,0.04); }
  .panel h2 { font-size:18px; margin:0 0 24px; color:#1d1d1f; font-weight:700; letter-spacing:-0.3px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; margin-bottom:20px; }
  
  /* 테두리 없이 면(Surface)으로 구분되는 입력칸 */
  .field { display:flex; flex-direction:column; gap:8px; }
  .field label { font-size:12px; color:#86868b; font-weight:600; }
  .field input, .field select { padding:14px 16px; border:1px solid transparent; border-radius:12px; font-size:14.5px; width:140px; outline:none; transition:all 0.2s ease; background:#f5f5f7; color:#1d1d1f; font-weight:500; font-family:inherit; }
  .field select { width:160px; cursor:pointer; }
  
  /* 포커스 시 애플 특유의 블루 링 효과 */
  .field input:focus, .field select:focus { background:#ffffff; border-color:#0071e3; box-shadow:0 0 0 4px rgba(0, 113, 227, 0.1); }
  .field input.wide { width:260px; }
  
  /* 모서리가 둥근 메인 버튼 (애플 블루) */
  button { padding:14px 22px; border:none; border-radius:14px; background:#0071e3; color:#fff; font-size:14.5px; cursor:pointer; font-weight:600; letter-spacing:-0.2px; transition:all 0.2s; -webkit-tap-highlight-color: transparent; }
  button:hover { background:#0077ed; }
  button:active { transform:scale(0.97); }
  button.small { padding:8px 14px; font-size:12.5px; border-radius:10px; }
  
  /* 서브 버튼들도 테두리 없이 배경색만으로 깔끔하게 처리 */
  button.success-outline { background:#f5f5f7; color:#1d1d1f; border:none; box-shadow:none; display:flex; align-items:center; justify-content:center; gap:4px; }
  button.success-outline:hover { background:#e8e8ed; color:#0071e3; }
  button.secondary { background:#f5f5f7; color:#1d1d1f; border:none; box-shadow:none; }
  button.secondary:hover { background:#e8e8ed; }
  button.danger { background:#fef0f0; color:#d50000; border:none; box-shadow:none; }
  button.danger:hover { background:#fee2e2; }
  
  /* 🌟 상단바 우측영역 (신고접수 + 차단버튼) 디자인 */
  .board-header-right { display:flex; gap:12px; align-items:center; }
  .header-utilities { display:flex; flex-direction:column; gap:6px; }
  .btn-util { padding:6px 12px; font-size:12px; font-weight:700; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.35); color:#cbd5e1; cursor:pointer; transition:0.2s; text-align:center; line-height:1.2; min-width:145px; }
  .btn-util:hover { background:rgba(0,0,0,0.5); }
  .btn-util.elec.active { background:#e11d48; color:#fff; border-color:#fda4af; }
  .btn-util.gas.active { background:#ea580c; color:#fff; border-color:#fdba74; }

  #titleLine{ color:#fff; }
  .stat-cards{ display:flex;gap:12px;margin:4px 0 16px; flex-wrap: wrap; }
  .stat-card{ flex:1; min-width:100px; text-align:center;border-radius:12px;padding:18px 10px 15px; background:rgba(255, 255, 255, 0.9); border:1px solid var(--panel-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); }
  .stat-card .num{ font-size:36px;font-weight:900;line-height:1; }
  .stat-card .label{font-size:13px;color:#64748b;margin-top:8px;font-weight:700;}
  .stat-card.total .num{color:var(--navy);}
  .stat-card.rescue .num{color:var(--rescue);}
  .stat-card.evac .num{color:var(--evac);}
  .stat-card.clear .num{color:var(--clear-bg);}
  .stat-card.total{border-top:4px solid var(--navy);}
  .stat-card.rescue{border-top:4px solid var(--rescue);}
  .stat-card.evac{border-top:4px solid var(--evac);}
  .stat-card.clear{border-top:4px solid var(--clear-bg);}
  
  /* 🌟 상단바 구조 (좌측 아이콘/제목, 우측 신고접수일시 배치) */
  .board-header { 
    display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; 
    background:linear-gradient(135deg, var(--navy), #334155); padding:16px 20px; border-radius:14px; box-shadow:0 4px 12px rgba(15,23,42,0.2); 
  }
  .board-header-left { display:flex; align-items:center; gap:16px; }
  .board-header .icon-badge{ width:60px;height:60px;border-radius:50%;flex-shrink:0; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); display:flex;align-items:center;justify-content:center; }
  .board-header .icon-badge svg{width:40px;height:40px;}
  .board-header-text{text-align:left;}
  .board-title{font-size:22px;font-weight:800;color:#fff;min-height:24px;}
  .board-subtitle{font-size:13px;color:#cbd5e1;margin-top:4px;font-weight:600;letter-spacing:0.5px;}

  /* 🌟 우측 상단 신고접수일시 표시 박스 스타일 */
  .header-dispatch-info {
    text-align: right;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.35);
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
    font-size: 13px;
  }
  .header-dispatch-info .dispatch-label { color: #94a3b8; font-weight: 700; font-size: 11px; display: block; margin-bottom: 2px;}
  .header-dispatch-info .dispatch-val { color: #38bdf8; font-weight: 700; font-size: 14px; }

  .legend{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:8px;font-size:12px;font-weight:600;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:16px;height:16px;display:inline-block;border-radius:4px;}
  
  #boardHolder{ overflow-x:auto;-webkit-overflow-scrolling:touch; border-radius:12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  table.board{ border-collapse:collapse;background:rgba(255, 255, 255, 0.5); }
  table.board.fit-table{width:100%;table-layout:fixed;}
  table.board.scroll-table{width:max-content;min-width:560px;table-layout:auto;}
  table.board td, table.board th{ border:1px solid var(--line);text-align:center;vertical-align:middle; padding:10px 8px;font-size:13.5px;overflow-wrap:break-word; }
  table.board.tier-lg td, table.board.tier-lg th{padding:12px 10px;font-size:15px;}
  table.board.tier-md td, table.board.tier-md th{padding:10px 8px;font-size:13.5px;}
  table.board.tier-sm td, table.board.tier-sm th{padding:8px 6px;font-size:12px;}
  table.board.tier-xs td, table.board.tier-xs th{padding:6px 4px;font-size:11px;}
  table.board.tier-lg td.floor-cell{width:68px;font-size:16px;}
  table.board.tier-md td.floor-cell{width:60px;font-size:14px;}
  table.board.tier-sm td.floor-cell{width:50px;font-size:13px;}
  table.board.tier-xs td.floor-cell{width:42px;font-size:11.5px;}
  td.floor-cell{ font-weight:800;font-size:15px;background:rgba(248, 250, 252, 0.6);width:70px; color:var(--navy); }
  td.unit-no{font-weight:800;font-size:14.5px;padding-top:10px;color:var(--navy); margin-bottom: 6px;}
  td.unit-status{ padding-bottom:10px;cursor:pointer;min-height:40px; }
  td.unit-cell{cursor:pointer; transition: background 0.15s;}
  td.unit-cell:hover{background:#f1f5f9;}
  td.unit-cell.empty-cell{ background:repeating-linear-gradient(135deg, rgba(248,250,252,0.4), rgba(248,250,252,0.4) 8px, rgba(241,245,249,0.4) 8px, rgba(241,245,249,0.4) 16px); cursor:default; }
  
  .tag-clear { background: #f1f5f9; color: #047857; font-size: 12px; font-weight: 700; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; display: inline-block; border: 1px solid #a7f3d0; }
  .tag-locked { background: #f1f5f9; color: var(--locked); font-size: 12px; font-weight: 700; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; display: inline-block; border: 1px solid #cbd5e1; }
  .tag-evac { background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 700; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; display: inline-block; border: 1px solid #86efac; }
  .tag-rescue { background: #ffe4e6; color: #e11d48; font-size: 12px; font-weight: 700; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; display: inline-block; border: 1px solid #fda4af; }
  
  .status-note{font-size:11px;color:#475569;font-weight:500;margin-top:2px;}
  .origin-tag{color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(0,0,0,0.25);border-radius:6px;padding:4px 6px;margin-top:4px;}
  .spread-tag{color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px;font-size:11.5px;background:rgba(0,0,0,0.15);border-radius:6px;padding:4px 6px;}
  .noissue-row td{background:#f8fafc;font-size:13.5px;color:#475569;padding:10px;font-weight:600;}
  
  td.unit-cell.is-origin .unit-no, td.unit-cell.is-origin .status-note,
  td.unit-cell.is-spread .unit-no, td.unit-cell.is-spread .status-note,
  td.unit-cell.is-locked .unit-no, td.unit-cell.is-locked .status-note,
  td.unit-cell.is-clear .unit-no, td.unit-cell.is-clear .status-note {color:#fff;}
  
  td.unit-cell.is-origin .tag-clear, td.unit-cell.is-origin .tag-locked, td.unit-cell.is-origin .tag-evac, td.unit-cell.is-origin .tag-rescue,
  td.unit-cell.is-spread .tag-clear, td.unit-cell.is-spread .tag-locked, td.unit-cell.is-spread .tag-evac, td.unit-cell.is-spread .tag-rescue,
  td.unit-cell.is-clear .tag-clear, td.unit-cell.is-clear .tag-locked, td.unit-cell.is-clear .tag-evac, td.unit-cell.is-clear .tag-rescue,
  td.unit-cell.is-locked .tag-clear, td.unit-cell.is-locked .tag-locked, td.unit-cell.is-locked .tag-evac, td.unit-cell.is-locked .tag-rescue { background: rgba(255,255,255,0.2); color: #fff; border-color: transparent; }
  
  .legend .swatch.origin-sw{background:var(--origin);}
  .legend .swatch.spread-sw{background:var(--spread);}
  .legend .swatch.clear-sw{background:var(--clear-bg);}
  .legend .swatch.locked-sw{background:var(--locked);}
  /* 🌟 기본 (아이패드 전체, 핸드폰 가로): 기존처럼 가로로 나란히 배치 */
  .floor-controls { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .floor-controls button.small { word-break:keep-all; }

  /* 🌟 오직 '핸드폰 세로' 화면일 때만: 칸 밖으로 삐져나오지 않게 위아래로 쌓기 */
  @media (max-width: 640px) and (orientation: portrait) {
    .floor-controls { flex-direction:column; align-items:stretch; gap:4px; margin-top:8px; }
    .floor-controls button.small { width:100%; padding:6px 0; font-size:11px; margin:0; }
  }
  #footNotes{margin-top:16px;font-size:13px;line-height:1.7;color:#475569;font-weight:500;}
  #footNotes .fn-line{margin:3px 0;}
  .toolbar{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
  .empty-hint{color:#94a3b8;font-size:14px;text-align:center;padding:40px 0;font-weight:600;}
  .credit-line{text-align:center;font-size:12px;color:#94a3b8;margin:20px 0 10px;letter-spacing:0.5px;font-weight:600;}
  .board-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }

  /* modal */
  .overlay{ position:fixed;inset:0;background:rgba(15,23,42,0.6); display:flex;align-items:center;justify-content:center;z-index:10000; backdrop-filter: blur(2px); }
  .modal{ background:#fff;border-radius:14px;padding:24px;width:95vw; max-width:420px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; }
  .modal h3{margin:0 0 16px;font-size:16px;color:var(--navy);font-weight:800;}
  .modal .mrow{margin-bottom:12px;}
  .modal label{font-size:12.5px;color:#475569;display:block;margin-bottom:6px;font-weight:700;}
  .modal input[type=text], .modal input[type=number]{ width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px; outline:none; transition:border-color 0.2s; }
  .modal input:focus{border-color:var(--accent);}
  
  /* 🌟 수정된 체크박스 레이아웃 (줄바꿈 가능하게 flex-wrap 추가) */
  .modal .checks{display:flex;gap:16px;font-size:13px;align-items:center; flex-wrap:wrap;}
  
  .modal .checks label{display:flex;align-items:center;gap:6px;margin:0;font-weight:600;cursor:pointer;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .stepper-row{display:flex;align-items:center;gap:8px;}
  .stepper-row input{text-align:center;flex:1;}
  .setup-stepper{width:150px;}
  .setup-stepper input{width:60px;flex:none; pointer-events:none; background-color:#f8fafc;}
  .step-btn{ width:36px;height:36px;padding:0;font-size:18px;line-height:1;border-radius:8px; background:var(--navy);color:#fff;flex-shrink:0; }
  #detailsList, #evacDetailsList{max-height:80px;overflow-y:auto;margin-bottom:4px;}
  .detail-item{ display:flex;justify-content:space-between;align-items:center;gap:8px; font-size:12px;padding:4px 8px;background:#f8fafc;border-radius:6px;margin-bottom:4px; border:1px solid #e2e8f0; }
  .detail-add-row{display:flex;gap:8px;}
  .detail-add-row input{flex:1;}

  /* 🌟 타임스탬프 스타일 */
  .update-info { font-size: 10.5px; color: #94a3b8; font-weight: 600; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 3px; }
  td.unit-cell.is-origin .update-info,
  td.unit-cell.is-spread .update-info,
  td.unit-cell.is-locked .update-info,
  td.unit-cell.is-clear .update-info { color: rgba(255, 255, 255, 0.75); }

  tr.is-reported-floor td { border-top: 3px solid var(--origin) !important; border-bottom: 3px solid var(--origin) !important; }
  tr.is-reported-floor td:first-child { border-left: 3px solid var(--origin) !important; }
  tr.is-reported-floor td:last-child { border-right: 3px solid var(--origin) !important; }
  
  td.unit-cell.is-reported-unit { box-shadow: inset 0 0 0 4px var(--origin) !important; }
  .tag-reported { background: var(--origin); color: #fff; font-size: 12px; font-weight: 800; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; display: inline-block; border: 1px solid #b91c1c; }

  @media (min-width: 641px){
    .board-header{padding:20px 24px;}
    .board-header-text{ display:flex;align-items:baseline;flex-wrap:wrap;column-gap:18px;row-gap:4px; }
    .board-title{font-size:32px;min-height:auto;}
    .board-subtitle{margin-top:0;font-size:15px;}
    .icon-badge{width:64px;height:64px;}
    .icon-badge svg{width:36px;height:36px;}
  }

  @media (max-width: 640px){
    body{padding:12px;}
    h1{font-size:18px;}
    .panel{padding:16px;}
    .row{flex-direction:column;align-items:stretch;gap:12px;}
    .field{width:100%;}
    .field input, .field input.wide, .field select{width:100%;}
    .setup-stepper{width:100%;}
    .setup-stepper input{width:auto;}
    .board-header{flex-wrap:wrap;gap:12px;padding:16px;}
    .board-header-right{width:100%; justify-content:flex-end; flex-wrap:wrap; margin-top:4px;}
    .board-title{font-size:18px;}
    .toolbar{justify-content:stretch;flex-wrap:wrap;gap:8px;}
    .toolbar button{flex:1;}
  }

  @media print{
    body{background:#fff;padding:0;margin:0;}
    body::before {display:none !important;} 
    .panel, .toolbar, .board-topbar, #setupScreen, .floor-controls button, #autosaveNote, #loginScreen{display:none !important;}
    #captureTarget{max-width:100%; margin:0; padding:0;}
    .board-header{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none;border-radius:0;margin-bottom:10px;}
    .stat-card{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none;break-inside:avoid;}
    table.board{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    td.unit-cell{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<!-- 🔒 로그인 화면 -->
<div id="loginScreen">
  <div class="login-box">
    <h2>현황판 접속</h2>
    
    <!-- 🌟 추가된 직위 입력칸 -->
    <div class="field">
      <label>담당 직위(임무)</label>
      <input type="text" id="loginRole" placeholder="예: 팀장, 조사, 감식">
    </div>
    
    <div class="field">
      <label>이메일 아이디</label>
      <input type="email" id="loginEmail" placeholder="team@fire.com">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPwd" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') doLogin()">
    </div>

function getDefaultTimeStr() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
}

  const timeInput = document.getElementById('dispatchTime');
  if(timeInput && !timeInput.value) {
    timeInput.value = getDefaultTimeStr();
  }
});

auth.onAuthStateChanged(user => {
  if (user) {

    currentRole = localStorage.getItem('myRole') || '대원'; 
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    
    document.getElementById('btnLogout').style.display = 'inline-block';

    document.getElementById('btnBackToSetup').style.display = 'inline-block';
    document.getElementById('btnResetDB').style.display = 'inline-block';

});

function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const pwd = document.getElementById('loginPwd').value;
  const role = document.getElementById('loginRole').value.trim();
  document.getElementById('loginError').style.display = 'none';
  
  if(!email || !pwd) {
    document.getElementById('loginError').innerText = "아이디 또는 비밀번호를 입력해주세요.";
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  if(!role) {
    document.getElementById('loginError').innerText = "담당 직위(임무)를 입력해주세요.";
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  
  auth.signInWithEmailAndPassword(email, pwd)
    .then(() => {
      localStorage.setItem('myRole', role);
      currentRole = role;
    })
    .catch(error => {
      document.getElementById('loginError').innerText = "아이디 또는 비밀번호를 확인해주세요.";
      document.getElementById('loginError').style.display = 'block';

function captureBoard() {
  const captureTarget = document.getElementById('captureTarget');
  const boardHolder = document.getElementById('boardHolder');
  const mainWrap = document.getElementById('mainWrap');
  const toolbar = document.getElementById('toolbar');
  const topbar = document.querySelector('.board-topbar');
  const autosaveNote = document.getElementById('autosaveNote');

  window.scrollTo(0, 0);
  toolbar.style.display = 'none';
  topbar.style.display = 'none';
  autosaveNote.style.display = 'none';

  const origOverflow = boardHolder.style.overflow;
  const origMaxWidth = mainWrap.style.maxWidth;
  const origWidth = captureTarget.style.width;

  boardHolder.style.overflow = 'visible';
  mainWrap.style.maxWidth = 'none';
  captureTarget.style.width = Math.max(captureTarget.offsetWidth, boardHolder.scrollWidth) + 'px';

  setTimeout(() => {
    html2canvas(captureTarget, {
      scale: 1.5, useCORS: true, logging: false, backgroundColor: "#f1f5f9"
    }).then(canvas => {
      boardHolder.style.overflow = origOverflow;
      mainWrap.style.maxWidth = origMaxWidth;
      captureTarget.style.width = origWidth;
      
      toolbar.style.display = 'flex';
      topbar.style.display = 'flex';
      autosaveNote.style.display = 'block';

      const imgData = canvas.toDataURL('image/jpeg', 0.9);
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.id = 'captureOverlay';
      overlay.innerHTML = `
        <div class="modal" style="max-width:95vw; max-height:95vh; display:flex; flex-direction:column; align-items:center; padding:16px; z-index:10000;">
          <h3 style="margin-bottom:8px; font-size:16px; color:#10b981;">📷 캡처 완료</h3>
          <p style="font-size:13px; color:#475569; text-align:center; margin-bottom:12px;">사진을 <strong>꾹 누른 후 저장</strong>하세요.</p>
          <div style="overflow:auto; max-height:60vh; border:1px solid #cbd5e1; border-radius:8px; width:100%;">
            <img src="${imgData}" style="width:100%; display:block; user-select: auto;">
          </div>
          <button type="button" class="secondary" style="margin-top:16px; width:100%;" onclick="document.getElementById('captureOverlay').remove()">닫기</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }).catch(err => {
      console.error("캡처 오류:", err);
      boardHolder.style.overflow = origOverflow;
      mainWrap.style.maxWidth = origMaxWidth;
      captureTarget.style.width = origWidth;
      toolbar.style.display = 'flex';
      topbar.style.display = 'flex';
      autosaveNote.style.display = 'block';
      alert("기기 메모리가 부족합니다. 기본 캡처 기능을 이용해주세요.");
    });
  }, 300);
}

function saveState(){
  if(isReadOnly) return; 
  try{
    const updates = {
      bldgName: document.getElementById('bldgName').value,
      dispatchTime: document.getElementById('dispatchTime').value,
      topFloor: document.getElementById('topFloor').value,
      botFloor: document.getElementById('botFloor').value,
      skip4Floor: document.getElementById('skip4Floor').value,
      unitPattern: document.getElementById('unitPattern').value,
      unitsCount: document.getElementById('unitsCount').value,
      floors: floors,
      elec: elecData,
      gas: gasData,
      savedAt: new Date().toISOString()
    };
    
    dbRef.update(updates); 
    
    const note = document.getElementById('autosaveNote');
    if(note){
      const t = new Date();
      note.textContent = `서버 동기화됨 · ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    }
  }catch(e){
    console.error('저장 실패', e);
  }
}

function startDatabaseListener() {
  if(isListening) return;
  isListening = true;
  
  dbRef.on('value', (snapshot) => {
    const state = snapshot.val();
    
    if(!state) {
      if(isReadOnly) {
        document.getElementById('boardHolder').innerHTML = '<div class="empty-hint">아직 생성된 현황판이 없습니다.</div>';
      } else {
        const timeInput = document.getElementById('dispatchTime');
        if(timeInput && !timeInput.value) timeInput.value = getDefaultTimeStr();
      }
      return;
    }
    
    // 💡 입력칸 포커스 충돌 방지 및 안전한 데이터 갱신
    const activeEl = document.activeElement;
    const safeUpdate = (id, val) => {
        const el = document.getElementById(id);
        if(el && activeEl !== el && el.value !== val) {
            el.value = val || '';
        }
    };

    safeUpdate('bldgName', state.bldgName);
    safeUpdate('dispatchTime', state.dispatchTime);
    safeUpdate('topFloor', state.topFloor);
    safeUpdate('botFloor', state.botFloor);
    safeUpdate('skip4Floor', state.skip4Floor);
    safeUpdate('unitPattern', state.unitPattern);
    safeUpdate('unitsCount', state.unitsCount);
    
    // 💡 파이어베이스 배열 꼬임 완벽 복구
    if(state.floors) {
        let parsedFloors = Array.isArray(state.floors) ? state.floors : Object.values(state.floors);
        parsedFloors.forEach(fl => {
            if (fl && fl.units && !Array.isArray(fl.units)) {
                fl.units = Object.values(fl.units);
            }
        });
        floors = parsedFloors;
    } else {
        floors = [];
    }

    elecData = state.elec || { status: false, updateTime: '', updateBy: '' };
    gasData = state.gas || { status: false, updateTime: '', updateBy: '' };
    updateUtilityButtons();
    
    document.getElementById('backToBoardBtn').style.display = isReadOnly ? 'none' : 'inline-block';
    
    if(floors.length > 0) {
      render();
      if(isInitialLoad && !isReadOnly && document.getElementById('setupScreen').style.display !== 'none') {
        showBoardScreen();
      }
    }
    isInitialLoad = false;
  });
}

function resetAll(){
  if(isReadOnly) return;
  if(!confirm('데이터를 모두 지우고 초기화할까요?')) return;
  dbRef.remove().then(() => { location.reload(); });
}

function adjustUnitsCount(delta){
  if(isReadOnly) return;
  const el = document.getElementById('unitsCount');
  let v = (parseInt(el.value)||1) + delta;
  if(v < 1) v = 1;
  el.value = v;
  const width = v > 99 ? 3 : 2;
  const arr = [];
  for(let n=1; n<=v; n++) arr.push(String(n).padStart(width,'0'));
  document.getElementById('unitPattern').value = arr.join(',');
}
function syncUnitsCountFromPattern(){
  if(isReadOnly) return;
  const pattern = document.getElementById('unitPattern').value.split(',').map(s=>s.trim()).filter(Boolean);
  document.getElementById('unitsCount').value = pattern.length || 1;
}

function generateBoard(){
  if(isReadOnly) return;
  const top = parseInt(document.getElementById('topFloor').value);
  const bot = parseInt(document.getElementById('botFloor').value);
  const skipOption = document.getElementById('skip4Floor').value;
  const pattern = document.getElementById('unitPattern').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(isNaN(top) || isNaN(bot) || top < bot){ alert('최고층/최저층을 확인하세요.'); return; }
  if(pattern.length===0){ alert('호수 패턴을 입력하세요.'); return; }

  const oldFloorByName = {};
  floors.forEach(fl => { oldFloorByName[String(fl.floor)] = fl; });

  const newFloors = [];
  for(let f = top; f >= bot; f--){
    if(f === 4 && skipOption === 'skip') continue;
    let floorName = String(f);
    let floorPrefix = String(f);
    if(f === 4 && skipOption === 'f_floor'){ floorName = 'F'; floorPrefix = 'F'; }

    const oldFl = oldFloorByName[floorName];
    const oldUnitsByNo = {};
    if(oldFl) oldFl.units.forEach(u => { oldUnitsByNo[u.no] = u; });

    newFloors.push({
      floor: floorName,
      noIssue: oldFl ? oldFl.noIssue : false,
      units: pattern.map(suf => {
        const no = floorPrefix + suf;
        return oldUnitsByNo[no] || {
          no, isLocked: false, clearCount: 0, evacCount: 0, rescueCount: 0, origin: false, spread: false, evacDetails: [], rescueDetails: []
        };
      })
    });
  }
  floors = newFloors;
  render();
  saveState(); 
  document.getElementById('backToBoardBtn').style.display='inline-block';
  showBoardScreen();
}

function editUnits(floorIdx){
  if(isReadOnly) return;
  const fName = String(floors[floorIdx].floor);
  const cur = floors[floorIdx].units.map(u=>u.no.slice(fName.length)).join(',');
  const val = prompt(fName+'층 호수(뒤 2자리, 콤마구분) 수정:', cur);
  if(val===null) return;
  const pattern = val.split(',').map(s=>s.trim()).filter(Boolean);
  const oldByNo = {}; floors[floorIdx].units.forEach(u=>oldByNo[u.no]=u);
  floors[floorIdx].units = pattern.map(suf=>{
    const no = fName + suf;
    return oldByNo[no] || {no, isLocked: false, clearCount: 0, evacCount: 0, rescueCount: 0, origin: false, spread: false, evacDetails: [], rescueDetails: []};
  });
  render();
  saveState(); 
}

function toggleNoIssue(floorIdx){
  if(isReadOnly) return;
  floors[floorIdx].noIssue = !floors[floorIdx].noIssue;
  render();
  saveState(); 
}

// 🌟 층 단위 신고위치 설정 버튼 기능
function toggleReportedFloor(floorIdx){
  if(isReadOnly) return;
  floors[floorIdx].isReportedFloor = !floors[floorIdx].isReportedFloor;
  render();
  
  const now = new Date();
  // 실시간 즉각 동기화
  dbRef.child('floors/' + floorIdx).update({ isReportedFloor: floors[floorIdx].isReportedFloor })
    .then(() => {
      const note = document.getElementById('autosaveNote');
      if(note) note.textContent = `신고층 동기화 완료 · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }).catch(e => console.error(e));
}

let editing = null;
let editingDetails = [];
let editingEvacDetails = [];

function openEditor(floorIdx, unitIdx){
  if(isReadOnly) {
    alert("👀 관전 모드(읽기 전용)에서는 현황을 수정할 수 없습니다.\n수정하려면 '관리자 로그인'을 진행해주세요.");
    return;
  }
  editing = {floorIdx, unitIdx};
  const u = floors[floorIdx].units[unitIdx];
  editingDetails = (u.rescueDetails||[]).slice();
  editingEvacDetails = (u.evacDetails||[]).slice();
  
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.id='editorOverlay';
  
  overlay.innerHTML = `
    <div class="modal" style="z-index:100;">
      <h3>${u.no}호 현황 입력</h3>
      
      <div class="mrow" style="margin-top:0;">
        <label style="color:var(--clear-bg);">✅ 자택대기(이상없음) 인원</label>
        <div class="stepper-row">
          <button type="button" class="step-btn" onclick="adjustNewCount('m_clearCount', -1)">−</button>
          <input type="number" id="m_clearCount" min="0" value="${u.clearCount||0}">
          <button type="button" class="step-btn" onclick="adjustNewCount('m_clearCount', 1)">+</button>
        </div>
      </div>
      <hr style="border:0; border-top:1px solid #e2e8f0; margin:16px 0;">
      <div class="mrow">
        <label style="color:var(--evac);">🏃 자력대피 인원</label>
        <div class="stepper-row">
          <button type="button" class="step-btn" onclick="adjustNewCount('m_evacCount', -1)">−</button>
          <input type="number" id="m_evacCount" min="0" value="${u.evacCount||0}">
          <button type="button" class="step-btn" onclick="adjustNewCount('m_evacCount', 1)">+</button>
        </div>
        <div id="evacDetailsList" style="margin-top:8px;"></div>
        <div class="detail-add-row" style="margin-top:4px;">
          <input type="text" id="m_evacDetailInput" placeholder="메모 (예: 단순연기흡입)">
          <button type="button" class="small" onclick="addEvacDetailLine()">추가</button>
        </div>
      </div>
      <hr style="border:0; border-top:1px solid #e2e8f0; margin:16px 0;">
      <div class="mrow">
        <label style="color:var(--rescue);">🚁 구조 인원</label>
        <div class="stepper-row">
          <button type="button" class="step-btn" onclick="adjustNewCount('m_rescueCount', -1)">−</button>
          <input type="number" id="m_rescueCount" min="0" value="${u.rescueCount||0}">
          <button type="button" class="step-btn" onclick="adjustNewCount('m_rescueCount', 1)">+</button>
        </div>
        <div id="detailsList" style="margin-top:8px;"></div>
        <div class="detail-add-row" style="margin-top:4px;">
          <input type="text" id="m_detailInput" placeholder="메모 (예: OO병원 이송)">
          <button type="button" class="small" onclick="addDetailLine()">추가</button>
        </div>
      </div>
      <hr style="border:0; border-top:1px solid #e2e8f0; margin:16px 0;">
      
      <div class="mrow checks" style="margin-top:0; flex-wrap:wrap;">
        <label><input type="checkbox" id="m_isReported" ${u.isReportedUnit?'checked':''}> <span style="color:var(--origin);">🚨 신고세대</span></label>
        <label><input type="checkbox" id="m_origin" ${u.origin?'checked':''}> 🔥 발화지점</label>
        <label><input type="checkbox" id="m_spread" ${u.spread?'checked':''}> 💥 연소확대</label>
        <label><input type="checkbox" id="m_isLocked" ${u.isLocked?'checked':''}> 🔒 문잠김(미확인)</label>
      </div>
      
      <div class="modal-actions">
        <button type="button" class="secondary" onclick="closeEditor()">취소</button>
        <button type="button" onclick="saveEditor()">저장</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  document.getElementById('m_detailInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addDetailLine(); } });
  document.getElementById('m_evacDetailInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addEvacDetailLine(); } });
  renderDetailsList();
  renderEvacDetailsList();
}

function adjustNewCount(id, delta){
  const el = document.getElementById(id);
  let v = (parseInt(el.value)||0) + delta;
  if(v < 0) v = 0;
  el.value = v;
}
function renderDetailsList(){
  const box = document.getElementById('detailsList');
  if(!box) return;
  box.innerHTML = editingDetails.map((d,idx)=>`<div class="detail-item"><span>${idx+1}. ${d}</span><button type="button" class="small secondary" onclick="removeDetailLine(${idx})">삭제</button></div>`).join('');
}
function addDetailLine(){
  const input = document.getElementById('m_detailInput');
  const val = input.value.trim();
  if(!val) return;
  editingDetails.push(val); input.value=''; renderDetailsList();
}
function removeDetailLine(idx){ editingDetails.splice(idx,1); renderDetailsList(); }

function renderEvacDetailsList(){
  const box = document.getElementById('evacDetailsList');
  if(!box) return;
  box.innerHTML = editingEvacDetails.map((d,idx)=>`<div class="detail-item"><span>${idx+1}. ${d}</span><button type="button" class="small secondary" onclick="removeEvacDetailLine(${idx})">삭제</button></div>`).join('');
}
function addEvacDetailLine(){
  const input = document.getElementById('m_evacDetailInput');
  const val = input.value.trim();
  if(!val) return;
  editingEvacDetails.push(val); input.value=''; renderEvacDetailsList();
}
function removeEvacDetailLine(idx){ editingEvacDetails.splice(idx,1); renderEvacDetailsList(); }

function closeEditor(){
  const o = document.getElementById('editorOverlay');
  if(o) o.remove();
  editing = null; editingDetails = []; editingEvacDetails = [];
}

function saveEditor(){
  const {floorIdx, unitIdx} = editing;
  const u = floors[floorIdx].units[unitIdx];

  u.isReportedUnit = document.getElementById('m_isReported').checked;
  u.isLocked = document.getElementById('m_isLocked').checked;
  u.clearCount = parseInt(document.getElementById('m_clearCount').value)||0;
  u.evacCount = parseInt(document.getElementById('m_evacCount').value)||0;
  u.rescueCount = parseInt(document.getElementById('m_rescueCount').value)||0;
  u.origin = document.getElementById('m_origin').checked;
  u.spread = document.getElementById('m_spread').checked;
  
  u.evacDetails = editingEvacDetails.slice();
  u.rescueDetails = editingDetails.slice();
  
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  
  u.lastUpdatedTime = `${hh}:${mm}`;
  u.lastUpdatedBy = currentRole; 
  
  closeEditor();
  render(); 
  
  if(!isReadOnly) {
    dbRef.child('floors/' + floorIdx + '/units/' + unitIdx).update(u)
      .then(() => {
        const note = document.getElementById('autosaveNote');
        if(note) note.textContent = `부분 동기화 완료 · ${hh}:${mm}:${ss}`;
      })
      .catch(e => console.error("업데이트 실패", e));
  }
}

window.__cellClick = function(td){
  const fi = parseInt(td.getAttribute('data-fi'));
  const ui = parseInt(td.getAttribute('data-ui'));
  openEditor(fi, ui);
};

function render(){
  document.getElementById('toolbar').style.display='flex';
  document.getElementById('iconBadge').innerHTML = APT_FIRE_ICON_SVG;
  const name = document.getElementById('bldgName').value.trim();
  document.getElementById('titleLine').textContent = name || '';

  const dTime = document.getElementById('dispatchTime').value.trim();
  document.getElementById('viewDispatchTime').textContent = dTime || '-';

  let evacTotal=0, rescueTotal=0, evacSelfTotal=0, clearTotal=0;
  const evacDetail = [];
  const rescueDetail = [];
  
  floors.forEach(fl=>{
    fl.units.forEach(u=>{
      const cc = u.clearCount || 0;
      if(cc > 0) clearTotal += cc;
      
      const ec = u.evacCount || 0;
      const rc = u.rescueCount || 0;
      
      if(ec > 0){
        evacTotal += ec; evacSelfTotal += ec;
        let eline = u.no+'호 '+ec+'명';
        if(u.evacDetails && u.evacDetails.length) eline += ' ['+u.evacDetails.join('; ')+']';
        evacDetail.push(eline);
      }
      if(rc > 0){
        rescueTotal += rc; evacTotal += rc;
        let line = u.no+'호 '+rc+'명';
        if(u.rescueDetails && u.rescueDetails.length) line += ' ['+u.rescueDetails.join('; ')+']';
        rescueDetail.push(line);
      }
    });
  });
  
  document.getElementById('summaryCards').innerHTML = `
    <div class="stat-card total"><div class="num">${evacTotal}</div><div class="label">총 대피(명)</div></div>
    <div class="stat-card rescue"><div class="num">${rescueTotal}</div><div class="label">구조(명)</div></div>
    <div class="stat-card evac"><div class="num">${evacSelfTotal}</div><div class="label">자력대피(명)</div></div>
    <div class="stat-card clear"><div class="num">${clearTotal}</div><div class="label">자택대기(명)</div></div>
  `;

  function unitSuffix(u, floorName){ return u.no.slice(String(floorName).length); }
  const suffixSet = new Set();
  floors.forEach(fl=> fl.units.forEach(u=> suffixSet.add(unitSuffix(u, fl.floor))));
  const columns = Array.from(suffixSet).sort((a,b)=> a.localeCompare(b, undefined, {numeric:true}));
  const maxUnits = columns.length || 1;
  const totalCols = maxUnits + 1; 
  let sizeTier, layoutMode;
  if(totalCols <= 5){ sizeTier='tier-lg'; layoutMode='fit-table'; }
  else if(totalCols <= 7){ sizeTier='tier-md'; layoutMode='fit-table'; }
  else if(totalCols <= 10){ sizeTier='tier-sm'; layoutMode='fit-table'; }
  else if(totalCols <= 14){ sizeTier='tier-xs'; layoutMode='fit-table'; }
  else { sizeTier='tier-xs'; layoutMode='scroll-table'; }
  const floorWeight = 1.4, unitWeight = 1;
  const totalWeight = floorWeight + maxUnits*unitWeight;
  const floorPct = (floorWeight/totalWeight*100).toFixed(2);
  const unitPct = (unitWeight/totalWeight*100).toFixed(2);
  let colgroupHtml = '<colgroup>';
  if(layoutMode==='fit-table'){
    colgroupHtml += `<col style="width:${floorPct}%">`;
    for(let c=0;c<maxUnits;c++) colgroupHtml += `<col style="width:${unitPct}%">`;
  }
  colgroupHtml += '</colgroup>';
  let html = `<table class="board ${sizeTier} ${layoutMode}">${colgroupHtml}<tbody>`;
  let i=0;
  
  while(i < floors.length){
    const fl = floors[i];
    
    // 🌟 버튼이 눌리면 붉게 변하도록 스타일 지정
    const btnReportStyle = fl.isReportedFloor ? 'color:var(--origin); font-weight:bold; background:#fee2e2; border-color:#fca5a5;' : '';
    
    // 🌟 '신고층' 버튼 추가
    const controlsHtml = isReadOnly ? '' : (
      fl.noIssue 
      ? `<div class="floor-controls">
           <button type="button" class="small secondary" onclick="toggleNoIssue(${i})">해제</button>
           <button type="button" class="small secondary" onclick="toggleReportedFloor(${i})" style="${btnReportStyle}">🚨신고층</button>
         </div>`
      : `<div class="floor-controls">
           <button type="button" class="small secondary" onclick="editUnits(${i})">세대수정</button>
           <button type="button" class="small secondary" onclick="toggleNoIssue(${i})">특이없음</button>
           <button type="button" class="small secondary" onclick="toggleReportedFloor(${i})" style="${btnReportStyle}">🚨신고층</button>
         </div>`
    );
      
    // 🌟 층 전체 붉은 테두리 클래스 적용
    const trCls = fl.isReportedFloor ? 'is-reported-floor' : '';
    html += `<tr class="${trCls}"><td class="floor-cell">${fl.floor}층${controlsHtml}</td>`;
      
    columns.forEach(suf=>{
      const ui = fl.units.findIndex(x=> unitSuffix(x, fl.floor)===suf);
      if(ui===-1){
        html += `<td class="unit-cell empty-cell"></td>`;
        return;
      }
      const u = fl.units[ui];
      
      const isReportedUnit = u.isReportedUnit;
      const reportedCls = isReportedUnit ? ' is-reported-unit' : '';
      const reportedTag = isReportedUnit ? `<div class="tag-reported">🚨 신고세대</div>` : '';
      
      if (fl.noIssue) {
        html += `<td class="unit-cell is-clear${reportedCls}" style="background:var(--clear-bg); cursor:default;">
          <div class="unit-no" style="color:#fff;">${u.no}호</div>
          <div class="unit-status">
            ${reportedTag}
            <div class="tag-clear" style="background:rgba(255,255,255,0.2); color:#fff; border-color:transparent; font-size:12px; padding:6px 8px; margin-top:4px;">✅ 특이사항 없음</div>
          </div>
        </td>`;
        return; 
      }
      
      const cc = u.clearCount || 0;
      const isClearActive = cc > 0; 

      let bg = u.origin ? 'var(--origin)' : (u.spread ? 'var(--spread)' : (isClearActive ? 'var(--clear-bg)' : (u.isLocked ? 'var(--locked)' : '')));
      let cellCls = 'unit-cell' + (u.origin ? ' is-origin' : (u.spread ? ' is-spread' : (isClearActive ? ' is-clear' : (u.isLocked ? ' is-locked' : '')))) + reportedCls;
      
      let bodyHtml = reportedTag; // 신고세대를 맨 위에 표시
      if(isClearActive) bodyHtml += `<div class="tag-clear">✅ 이상없음 ${cc}명</div>`;
      if(u.isLocked) bodyHtml += `<div class="tag-locked">🔒 문잠김</div>`;
      
      const ec = u.evacCount || 0;
      if(ec > 0) bodyHtml += `<div class="tag-evac">자력대피 ${ec}명</div>`;
      if(u.evacDetails && u.evacDetails.length) bodyHtml += `<div class="status-note">${u.evacDetails.map(d=>'· '+d).join('<br>')}</div>`;
      
      const rc = u.rescueCount || 0;
      if(rc > 0) bodyHtml += `<div class="tag-rescue">구조 ${rc}명</div>`;
      if(u.rescueDetails && u.rescueDetails.length) bodyHtml += `<div class="status-note">${u.rescueDetails.map(d=>'· '+d).join('<br>')}</div>`;

      const originTag = u.origin ? `<div class="origin-tag">🔥 발화지점</div>` : '';
      const spreadTag = (!u.origin && u.spread) ? `<div class="spread-tag">💥 연소확대</div>` : '';
      
      const updateLog = u.lastUpdatedTime ? `<div style="font-size:10.5px; color:#fff; background:rgba(0,0,0,0.4); border-radius:4px; padding:2px 4px; margin-top:6px; font-weight:600; display:inline-block;">🕒 ${u.lastUpdatedTime} (${u.lastUpdatedBy})</div>` : '';
      
      html += `<td class="${cellCls}" data-fi="${i}" data-ui="${ui}" onclick="__cellClick(this)" style="${bg?('background:'+bg+';'):''}">
        <div class="unit-no">${u.no}호</div>
        <div class="unit-status">${bodyHtml}${originTag}${spreadTag}<br>${updateLog}</div>
      </td>`;
    });
    html += `</tr>`;
    i++;
  }
  html += '</tbody></table>';
  document.getElementById('boardHolder').innerHTML = html;

  let fn = '';
  if(evacSelfTotal>0) fn += `<div class="fn-line">※ 자력대피 ${evacSelfTotal}명: ${evacDetail.join(', ')}</div>`;
  if(rescueTotal>0) fn += `<div class="fn-line">※ 구조 ${rescueTotal}명: ${rescueDetail.join(', ')}</div>`;
  document.getElementById('footNotes').innerHTML = fn;
}

function updateUtilityButtons() {
    const btnElec = document.getElementById('btn-elec');
    const btnGas = document.getElementById('btn-gas');
    
    if(btnElec) {
        if (elecData.status) {
            btnElec.classList.add('active');
            btnElec.innerHTML = `전기차단 O<br><span style="font-size:10.5px; font-weight:normal; opacity:0.9;">(${elecData.updateTime} / ${elecData.updateBy})</span>`;
        } else {
            btnElec.classList.remove('active');
            btnElec.innerHTML = `전기차단 X`;
        }
    }
    
    if(btnGas) {
        if (gasData.status) {
            btnGas.classList.add('active');
            btnGas.innerHTML = `가스차단 O<br><span style="font-size:10.5px; font-weight:normal; opacity:0.9;">(${gasData.updateTime} / ${gasData.updateBy})</span>`;
        } else {
            btnGas.classList.remove('active');
            btnGas.innerHTML = `가스차단 X`;
        }
    }
}

function toggleUtility(type) {
    if(isReadOnly) {
        alert("👀 관전 모드(읽기 전용)에서는 상태를 변경할 수 없습니다.\n관리자 로그인 후 이용해주세요.");
        return;
    }
    
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const timeStr = `${hh}:${mm}`;
    
    if(type === 'elec') {
        const newStatus = !elecData.status;
        const newData = {
            status: newStatus,
            updateTime: newStatus ? timeStr : '',
            updateBy: newStatus ? currentRole : ''
        };
        dbRef.child('elec').set(newData); 
    } else {
        const newStatus = !gasData.status;
        const newData = {
            status: newStatus,
            updateTime: newStatus ? timeStr : '',
            updateBy: newStatus ? currentRole : ''
        };
        dbRef.child('gas').set(newData);
    }
}
</script>
</body>
</html>
